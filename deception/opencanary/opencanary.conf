{
  "device.node_id": "opencanary-multi-node1",
  "ip.ignorelist": ["127.0.0.1"],
  
  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "FTP server (vsftpd 3.0.3) ready.",
  
  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Apache/2.4.41 (Ubuntu)",
  "http.skin": "basicLogin",
  "http.skin.list": ["basicLogin"],
  
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.33-0ubuntu0.18.04.1",
  
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/log/opencanary/opencanary.json"
        }
      }
    }
  }
}
